<!DOCTYPE html>
<html lang="fi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cafe La Française</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Tangerine">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="container-fluid">
            <header class="kuva-alue">
                <img src="kuvat/header-kuva.webp" alt="Lajitelma ranskalaisia leivonnaisia">
                <div class="kuvateksti">
                    <h3><b>Café La Française</b></h3>
                </div>
            </header>
        
            <nav class="navbar navbar-expand-sm">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapsibleNavbar">
            <span class=navbar-toggler-icon></span>
                </button>
                <div class="collapse navbar-collapse" id="collapsibleNavbar">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Etusivu</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Leivonnaiset</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Kahvit</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Yhteystiedot</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main>
                <!-- Kuvakaruselli -->
                <div id="demo" class="carousel slide" data-bs-ride="carousel">

                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#demo" data-bs-slide-to="0"
                        class="active"></button>
                        <button type="button" data-bs-target="#demo" data-bs-slide-to="1">
                        </button>
                        <button type="button" data-bs-target="#demo" data-bs-slide-to="2">                            
                        </button>
                        <button type="button" data-bs-target="#demo" data-bs-slide-to="3">
                        </button>
                    </div>

                    <!-- Slideshow -->
                     <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="kuvat/leivos2.webp" alt="Leivonnaisia" class="d-block w-100">
                            <div class="carousel-caption">
                                <h3>Herkullisia leivonnaisia</h3>
                            </div>
                        </div>
                        <div class="carousel-item">
                            <img src="kuvat/leivos3.webp" alt="Croissantteja" class="d-block w-100">
                            <div class="carousel-caption">
                                <h3>Suussa sulavia croissantteja</h3>
                            </div>
                        </div>
                        <div class="carousel-item">
                            <img src="kuvat/espresso.webp" alt="Espresso-juoma" class="d-block w-100">
                            <div class="carousel-caption">
                                <h3>Paikan päällä paahdettua kahvia</h3>
                            </div>
                        </div>
                        <div class="carousel-item">
                            <img src="kuvat/kahvila1.webp" alt="Kahvila sisältä" class="d-block w-100">
                            <div class="carousel-caption">
                                <h3>Tunnelmallisessa miljöössä</h3>
                            </div>
                        </div>
                     </div>

                     <!-- Kuvakarusellin selausnäppäimet -->
                      <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                      </button>
                      <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                      </button>
                </div>

                <h3>Tähän tulee tekstiä</h3>
                <p>Tähän tulee lisää tekstiä</p>
                
            </main>

            <footer>
                <h1>Tässä on footer</h1>
            </footer>
        </div>
    </body>
</html>
